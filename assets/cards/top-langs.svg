<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="title desc">
  <title id="title">语言构成</title>
  <desc id="desc">C++ 30.8%，Go 17.7%，JavaScript 16.5%，Rust 15.5%，HTML 13.3%，CSS 3.1%，Assembly 3.0%，C 0.1%</desc>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #C8F45A; }
    .description { font: 400 13px 'Segoe UI', Ubuntu, 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #C9D1D9; }
    .gray { font: 400 12px 'Segoe UI', Ubuntu, 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #C9D1D9; }
    .badge { font: 600 11px 'Segoe UI', Ubuntu, 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #C9D1D9; }
    .value { font: 700 24px 'Segoe UI', Ubuntu, 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #E7EAE4; }
    .label { font: 400 11px 'Segoe UI', Ubuntu, 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #6B7378; letter-spacing: 2px; }
  </style>

  <rect x="0.5" y="0.5" width="494" height="194" rx="4.5" fill="#0B0D0F"/>

  <text x="25" y="35" class="header">LANGUAGE PROFILE</text>
  <line x1="25" y1="52" x2="470" y2="52" stroke="#ffffff" stroke-opacity="0.06"/>

  <circle cx="30" cy="78" r="5" fill="#f34b7d"/>
  <text x="45" y="82" class="gray">C++</text>
  <text x="230" y="82" class="gray" text-anchor="end">30.8%</text>
  <circle cx="270" cy="78" r="5" fill="#00ADD8"/>
  <text x="285" y="82" class="gray">Go</text>
  <text x="470" y="82" class="gray" text-anchor="end">17.7%</text>
  <circle cx="30" cy="108" r="5" fill="#f1e05a"/>
  <text x="45" y="112" class="gray">JavaScript</text>
  <text x="230" y="112" class="gray" text-anchor="end">16.5%</text>
  <circle cx="270" cy="108" r="5" fill="#dea584"/>
  <text x="285" y="112" class="gray">Rust</text>
  <text x="470" y="112" class="gray" text-anchor="end">15.5%</text>
  <circle cx="30" cy="138" r="5" fill="#e34c26"/>
  <text x="45" y="142" class="gray">HTML</text>
  <text x="230" y="142" class="gray" text-anchor="end">13.3%</text>
  <circle cx="270" cy="138" r="5" fill="#663399"/>
  <text x="285" y="142" class="gray">CSS</text>
  <text x="470" y="142" class="gray" text-anchor="end">3.1%</text>
  <circle cx="30" cy="168" r="5" fill="#6E4C13"/>
  <text x="45" y="172" class="gray">Assembly</text>
  <text x="230" y="172" class="gray" text-anchor="end">3.0%</text>
  <circle cx="270" cy="168" r="5" fill="#555555"/>
  <text x="285" y="172" class="gray">C</text>
  <text x="470" y="172" class="gray" text-anchor="end">0.1%</text>
</svg>
